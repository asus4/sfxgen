<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f2f4" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="sfxgen: sound effects as JSON patches. Listen, turn the knobs an agent chose, export a WAV." />
    <title>sfxgen</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f1f2f4'/%3E%3Ccircle cx='13' cy='16' r='9' fill='%23FF48B0'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%230078BF' style='mix-blend-mode:multiply'/%3E%3C/svg%3E"
    />
    <script>
      // Paint the right paper before the app loads.
      try {
        var s = JSON.parse(localStorage.getItem('sfxgen:settings') || '{}');
        document.documentElement.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
