<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e4e5e7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="sfxgen: a sound-effect instrument. Sounds are JSON patches; turn the knobs an agent chose, balance the set, export." />
    <title>sfxgen</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1d20'/%3E%3Cpath d='M16 6a10 10 0 1 0 8.7 15' fill='none' stroke='%2335c8ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M16 16l5-6' stroke='%23f1f2ec' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Paint the right paper before the app loads.
      try {
        var s = JSON.parse(localStorage.getItem('sfxgen:settings') || '{}');
        document.documentElement.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
